server.port=${PORT:8081}
spring.datasource.url=${IAM_DB_URL:jdbc:opengauss://localhost:15432/library}
spring.datasource.username=db_iam_runtime
spring.datasource.password=${IAM_DB_PASSWORD}
spring.datasource.driver-class-name=org.opengauss.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Shanghai'
server.error.include-message=never
