<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>读者登录 · 校园图书室</title>
<style>
  :root { color-scheme: light; font-family: "Microsoft YaHei", sans-serif; color:#20342e; background:#f6f7f3 }
  main { max-width:29rem; margin:9vh auto; padding:2rem; background:white; border:1px solid #dbe2dc; border-radius:10px }
  h1 { font-size:1.6rem; margin:0 0 1.6rem } h2 { font-size:1.15rem; margin-top:2rem }
  label { display:block; margin:1rem 0 } input, button { font:inherit; box-sizing:border-box; padding:.7rem; border-radius:5px }
  input { width:100%; margin-top:.3rem; border:1px solid #aab5ae } button { border:0; background:#235645; color:white; cursor:pointer }
  button:disabled { opacity:.6 } dl { display:grid; grid-template-columns: minmax(7rem,auto) 1fr; gap:.7rem }
  dd { margin:0; overflow-wrap:anywhere; font-family:monospace } #status {line-height:1.6}
</style>
<main>
  <h1>校园图书室读者登录</h1>
  <form id="login">
    <label>读者账号<input name="username" autocomplete="username" placeholder="reader01 或 reader02" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button id="submit">登录并查看数据库身份</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <h2>借阅服务的数据库会话</h2>
    <dl><dt>读者账号</dt><dd id="reader"></dd>
    <dt>current_user</dt><dd id="current"></dd>
    <dt>session_user</dt><dd id="session"></dd></dl>
  </section>
</main>
<script src="reader-login.js" defer></script>
</html>
