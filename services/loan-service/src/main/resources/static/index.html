<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>C · 图书借还</title>
<style>body{max-width:1000px;margin:40px auto;padding:20px;font:16px system-ui;background:#f3f6fa;color:#182d40}section{background:white;padding:24px;margin:20px 0;border-radius:12px}input,button{padding:10px;margin:5px;border:1px solid #aab9c8;border-radius:6px}button{background:#174c72;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}#status{white-space:pre-wrap}label{display:inline-block}</style>
<h1>图书借还工作台</h1><p>读者借阅、归还自己的图书；馆员可代办并登记副本。</p>
<section><label>登录令牌 <input id="token" type="password" autocomplete="off"></label><button id="connect">连接账号</button><span id="who"></span><p>集成登录页后由 A 提供令牌；当前令牌仅保存在本页内存中。</p></section>
<section><h2>借阅办理</h2><label>读者编号<input id="reader" type="number" min="1"></label><label>副本编号<input id="copy" type="number" min="1"></label><label>天数<input id="days" type="number" min="1" max="30" value="14"></label><button id="borrow">确认借阅</button><button id="newkey">开始新请求</button><p>网络失败后保留原请求号重试；修改借阅内容前请开始新请求。</p></section>
<section><h2>可借副本</h2><button id="loadcopies">刷新</button><button id="morecopies">下一页</button><div id="copies"></div><details><summary>馆员登记副本</summary><input id="book" type="number" placeholder="书目编号"><input id="barcode" placeholder="唯一条码"><button id="addcopy">登记</button></details></section>
<section><h2>借阅记录</h2><label><input id="all" type="checkbox">馆员查看全部</label><button id="loadloans">刷新</button><button id="moreloans">下一页</button><div id="loans"></div></section><section><h2>馆员基础资料维护</h2><details><summary>录入书目快照（来自书目模块）</summary><input id="snapshotBook" type="number" placeholder="书目编号"><input id="snapshotTitle" placeholder="书名"><input id="snapshotIsbn" placeholder="ISBN"><button id="saveSnapshot">保存书目快照</button></details><details><summary>维护读者借阅资格</summary><input id="borrowerId" type="number" placeholder="读者编号"><input id="quota" type="number" min="1" max="100" value="5"><label><input id="active" type="checkbox" checked>允许借阅</label><button id="saveBorrower">保存读者资格</button></details></section><section role="status" id="status">等待登录</section>
<script src="app.js"></script></html>
