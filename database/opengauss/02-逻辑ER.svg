  <g font-family="Segoe UI, sans-serif">
    <rect x="20" y="1120" width="1560" height="140" rx="12" fill="#ffffff" stroke="#d5dde6"/>
    <text x="36" y="1148" font-size="15" font-weight="700" fill="#1c2430">Shared ids across schemas. No foreign keys.</text>
    <text x="36" y="1176" font-size="13" fill="#3d4d63">user_id: iam.app_user, loan.borrower_account, report.reader_dim, loan.loan_record, report.loan_fact</text>
