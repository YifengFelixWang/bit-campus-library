services:
  identity-service:
    environment:
      REPORT_SYNC_TOKEN: ${REPORT_SYNC_TOKEN:-}
  catalog-service:
    build: ../../services/catalog-service
    environment:
      IDENTITY_URL: http://identity-service:8081/users/me
      CATALOG_DB_URL: ${LIBRARY_JDBC_URL:-jdbc:opengauss://host.docker.internal:15432/library}
      CATALOG_DB_READER01_PASSWORD: ${CATALOG_DB_READER01_PASSWORD:?Set the reader01 DB password}
      CATALOG_DB_READER02_PASSWORD: ${CATALOG_DB_READER02_PASSWORD:?Set the reader02 DB password}
      CATALOG_DB_LIBRARIAN01_PASSWORD: ${CATALOG_DB_LIBRARIAN01_PASSWORD:?Set the librarian DB password}
    volumes:
      - ../../web/covers:/app/web/covers
  report-service:
    build: ../../services/report-service
    environment:
      IDENTITY_URL: http://identity-service:8081/users/me
      LOAN_SERVICE_URL: http://loan-service:8083
      LIBRARY_JDBC_URL: ${LIBRARY_JDBC_URL:-jdbc:opengauss://host.docker.internal:15432/library}
      REPORT_DB_ANALYST_PASSWORD: ${REPORT_DB_ANALYST_PASSWORD:?Set the report analyst DB password}
      REPORT_DB_SYNC_PASSWORD: ${REPORT_DB_SYNC_PASSWORD:?Set the report sync DB password}
      REPORT_SYNC_TOKEN: ${REPORT_SYNC_TOKEN:-}
  dbops-service:
    build:
      # 上下文必须是服务目录：Dockerfile 里是 COPY server.py ./ ，指到仓库根会找不到
      context: ../../services/dbops-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18085:18085"
    depends_on:
      - identity-service
    environment:
      DBOPS_PORT: "18085"
      IDENTITY_URL: http://identity-service:8081
      OPS_REQUIRED_ROLE: OPERATOR
      OPS_EXEC_MODE: docker
      OPS_DB_CONTAINER: ${OPS_DB_CONTAINER:-library-opengauss}
      OPS_STANDBY_CONTAINER: ${OPS_STANDBY_CONTAINER:-}
      OPS_DB_NAME: library
      OPS_DB_USER: ${OPS_DB_USER:-gaussdb}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?Set OPS_DB_PASSWORD in .env}
      OPS_DB_PORT: "5432"
      OPS_DB_DATADIR: /var/lib/opengauss/data
      OPS_BACKUP_DIR: /backup
      OPS_TASK_DIR: /var/lib/dbops/tasks
      OPS_CHECKLIST_SQL: /opt/dbops/sql/15-对象核对清单.sql
      OPS_NODE_A_HOST: ${OPS_NODE_A_HOST:-127.0.0.1}
      OPS_NODE_A_PORT: ${OPS_NODE_A_PORT:-15432}
      OPS_NODE_B_HOST: ${OPS_NODE_B_HOST:-127.0.0.1}
      OPS_NODE_B_PORT: ${OPS_NODE_B_PORT:-15433}
    volumes:
      - ../../backups:/backup
      - dbops-tasks:/var/lib/dbops/tasks
      - ../../tests/recovery:/opt/dbops/sql:ro
      # 仅用于本机演示：通过 Docker Desktop 的本地 socket 操作同机 openGauss 容器
      - /var/run/docker.sock:/var/run/docker.sock
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - catalog-service
      - identity-service
      - loan-service
      - report-service
      - dbops-service
    volumes:
      - ../../web:/usr/share/nginx/html:ro
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dbops-tasks:
