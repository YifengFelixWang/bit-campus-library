server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 请求体限制：书目导入的 CSV 不会超过这个量
    client_max_body_size 8m;

    # --- 书目服务（B）：必须放在 /api/ 之前，Nginx 按最长前缀匹配 ---
    location /api/catalog/ {
        proxy_pass         http://catalog-service:8082;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Request-Id      $request_id;
    }

    # --- 运维服务（E）：必须放在 /api/ 之前 ---
    location /api/ops/ {
        proxy_pass         http://dbops-service:18085;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 120s;
    }

    # --- 报表服务：必须放在 /api/ 之前 ---
    location /api/reports/ {
        proxy_pass         http://report-service:18084;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Request-Id      $request_id;
    }

    # --- 借阅服务（C）---
    location /api/ {
        proxy_pass         http://loan-service:8083;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_read_timeout 30s;
    }

    location /auth/ {
        proxy_pass http://identity-service:8081;
    }
    # A 的身份服务
    location /users/ {
        proxy_pass         http://identity-service:8081;
        proxy_set_header   Host              $host;
    }

    # --- 封面文件：media.file_url 存的是 covers/xxx.jpg 这种相对路径 ---
    location /covers/ {
        alias /usr/share/nginx/html/covers/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # 原始书籍文件（PDF/EPUB），compose 把宿主机目录挂到 /usr/share/nginx/files
    location /files/ {
        alias /usr/share/nginx/files/;
        autoindex off;
        add_header Cache-Control "private, max-age=3600";
    }

    # 前端是 hash 路由，静态文件找不到就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存策略：开发期关掉，避免改完看不到
    location ~* \.(js|css|json)$ {
        add_header Cache-Control "no-store";
    }
}
