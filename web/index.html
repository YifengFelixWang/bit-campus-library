  <script>
    // 直接双击 index.html 时浏览器处于 file:// 协议，会因 CORS 拒绝加载下面的 ES 模块，
    // 页面将白屏。此处提前给出明确指引，避免误判为程序损坏。
    if (location.protocol === "file:") {
      document.getElementById("app").innerHTML =
        '<div style="max-width:660px;margin:10vh auto;padding:28px 32px;border:1px solid #d8dee9;border-radius:12px;font-family:\'Microsoft YaHei\',system-ui,sans-serif;line-height:1.85;color:#1f2430;background:#fff;">' +
          '<h1 style="margin:0 0 12px;font-size:20px;font-weight:600;">请通过本地服务打开，不要直接双击本文件</h1>' +
          '<p style="margin:0 0 16px;color:#4a5160;">浏览器出于安全限制，会拒绝以 <code>file://</code> 方式加载本项目的 ES 模块，因此页面是空白的。这并不表示项目损坏或缺文件。</p>' +
          '<p style="margin:0 0 8px;font-weight:600;">正确做法（任选其一）：</p>' +
          '<ol style="margin:0 0 16px;padding-left:22px;color:#4a5160;">' +
            '<li>按项目 <b>README.md</b> 启动服务，再访问 <b>http://localhost:8080</b></li>' +
            '<li>在本目录执行 <code>python ../deploy/dev-server.py 8080</code>，再访问 <b>http://localhost:8080</b></li>' +
          '</ol>' +
          '<p style="margin:0;color:#7a5300;background:#fff8e6;border-left:3px solid #f0b429;padding:10px 14px;border-radius:6px;">注意：只起前端不够。书目与借阅接口还需要 8082 / 8083 两个服务，否则页面能显示但取不到数据。</p>' +
        '</div>';
    }
  </script>
